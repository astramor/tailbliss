{{/* layouts/partials/startseite/vision.html */}}

{{ with .Params.vision }}
  <div class="px-4 py-16 mx-auto max-w-5xl md:px-24 lg:px-8 lg:py-20">
    <!-- Kopfbereich -->
    <div class="max-w-xl mb-10 md:mx-auto sm:text-center lg:max-w-2xl md:mb-12">
      <div>
        <p class="inline-block px-3 py-px mb-4 text-xs font-semibold tracking-wider text-elm-500 uppercase rounded-full bg-teal-accent-400">
          {{ .heading }}
        </p>
      </div>
      <h2 class="max-w-lg mb-6 font-sans text-3xl font-bold leading-none tracking-tight text-gray-900 sm:text-4xl md:mx-auto h2">
        <span class="relative inline-block">
          <svg viewBox="0 0 52 24" fill="currentColor" class="absolute top-0 left-0 z-0 hidden w-32 -mt-8 -ml-20 text-blue-gray-100 lg:w-32 lg:-ml-28 lg:-mt-10 sm:block">
            <defs>
              <pattern id="pattern-vision" x="0" y="0" width=".135" height=".30">
                <circle cx="1" cy="1" r=".7"></circle>
              </pattern>
            </defs>
            <rect fill="url(#pattern-vision)" width="52" height="24"></rect>
          </svg>
          <span class="relative">Wir&nbsp;</span>
        </span>
        {{ .subtitle }}
      </h2>
    </div>

    <!-- CSS: default Marker vom <summary> ausblenden -->
    <style>
      summary::-webkit-details-marker { display: none; }
      summary::marker { content: ""; }
    </style>

    <!-- Accordion (ohne JS) -->
    <div class="accordion space-y-4">
      {{ range .sections }}
        <details class="rounded-lg border border-elm-200 bg-white">
          <summary
            class="w-full cursor-pointer select-none px-4 sm:px-5 py-3 sm:py-4 flex items-center justify-center gap-2"
          >
            <!-- Titel + Chevron nebeneinander, mittig -->
            <span class="text-base sm:text-lg font-semibold text-elm-500 flex items-center gap-2">
              {{ .title }}
              <span class="icon-[mdi--chevron-down] text-gray-500" aria-hidden="true"></span>
            </span>
          </summary>

          <div class="px-4 sm:px-5 pb-4 sm:pb-6">
            <div class="grid gap-4 sm:gap-6 md:gap-8 grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">
              {{ range .values }}
                <div class="bg-white border-l-4 border-elm-400 p-4 sm:p-5 shadow-sm">
                  <h6 class="font-semibold text-gray-700">{{ . }}</h6>
                </div>
              {{ end }}
            </div>
          </div>
        </details>
      {{ end }}
    </div>
  </div>
{{ end }}
