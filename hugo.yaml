baseURL: 'https://christustreff-mering.de'
title: Christustreff Mering
languageCode: de-de
DefaultContentLanguage: de
# 
buildExpired: false
buildFuture: false
#
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
canonifyURLs: true
pagination:
  pagerSize: 3
#darkmode_js:
#  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    renderHooks:
      image:
        enableDefault: true
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false


params:
  author: Markus Krause
  authorimage: ../assets/images/global/author.webp
  og_image: /images/tailbliss-cover.png
  moto: "Christustreff - Heimat Beziehung Glaueb"
  description: "Der Christustreff dein Treffpunkt für den Glauben"
  disable_theme_toggle: true
  disable_stay_uptodate: false


  Description: Christustreff Mering - Der Treffpunkt für Deinen Glauben
  


  social_media:
    youtube:
      enabled: true
      url: 'https://www.youtube.com/channel/UCunMZFcz6qILH_LheOPNYug'
    facebook:
      enabled: true
      url: 'https://www.facebook.com/profile.php?id=100064733284672'
    instagram:
      enabled: true
      url: 'https://www.instagram.com/christustreff_mering/'
    twitter:
      enabled: false
      url: ''
    

menu:
  main:
    - identifier: besuchen
      name: "Besuchen"
      url: "/besuchen/"
      weight: 10

    - identifier: dropdown
      pre: complexdropdown      # benutzt den großen Dropdown-Block
      name: "Mitmachen"
      url: "/mitmachen/"
      weight: 40

    - identifier: contact
      name: "Kontakt"
      url: "/kontakt/"
      weight: 70

  # Unterpunkte für das "Mitmachen"-Dropdown
  dropdown:
    - identifier: kinder-familie
      name: "Kinder und Familie"
      post: "Kinder- & Familiengottesdienst"
      url: "/mitmachen/kindergottesdienst/"
      weight: 10
      params:
        icon: "material-symbols--family-restroom" 

    - identifier: biber
      name: "Meringer Biber"
      post: "Pfadfindergruppe"
      url: "/mitmachen/pfadfinder/"
      weight: 20
      params:
        icon: "mdi--campfire"

    - identifier: seelsorge
      name: "Seelsorge"
      post: "Begleitung & Gebet"
      url: "/seelsorge/"
      weight: 30
      params:
        icon: "ic--baseline-hearing"

  footer:
    - identifier: contact
      name: Kontakt
      url: /kontakt/
      weight: 10
    - identifier: Datenschutz
      name: Datenschutz
      url: /datenschutz/
      weight: 40
    - identifier: Impressum
      name: Impressum
      url: /impressum/
      weight: 50

markup:
  goldmark:
    renderer:
      unsafe: true

taxonomies:
#  category: Categories
#  tag: Tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: false
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true


  hugoVersion:
    extended: true
    min: "0.104.0"
